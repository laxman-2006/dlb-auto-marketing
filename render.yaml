services:
  - type: web
    name: dlb-auto-marketing
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3001
      - key: DATA_DIR
        value: /app/data
      - key: META_GRAPH_API_VERSION
        value: v21.0
      - key: META_WEBHOOK_VERIFY_TOKEN
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: META_APP_ID
        value: ""
      - key: META_APP_SECRET
        value: ""
      - key: META_SYSTEM_USER_TOKEN
        value: ""
      - key: META_WABA_ID
        value: ""
      - key: META_PHONE_NUMBER_ID
        value: ""
