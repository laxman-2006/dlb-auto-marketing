services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dlb-auto-marketing
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3001
      - DATA_DIR=/app/data
      - META_GRAPH_API_VERSION=v21.0
      - META_WEBHOOK_VERIFY_TOKEN=dlb_webhook_token_secure_2026
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
